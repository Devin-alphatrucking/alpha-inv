services:
  postgres:
    image: postgres:16-alpine
    container_name: invoice-crm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: invoice_crm
      POSTGRES_PASSWORD: invoice_crm_dev_password
      POSTGRES_DB: invoice_crm
    ports:
      - "5433:5432"
    volumes:
      - invoice_crm_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice_crm -d invoice_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  invoice_crm_pg_data:
